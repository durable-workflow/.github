        \ --no-progress\ncomposer --working-dir=\"$application\" require \"$FRAMEWORK_EXERCISED_PACKAGE\"\
        \ \\\n  --with-all-dependencies --no-interaction --prefer-dist --no-progress\n\
        php scripts/ci/assert-installed-version.php \"$application\" laravel/framework\
