  framework-compat84:
    name: ${{ matrix.framework }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: action-policy
    strategy:
      fail-fast: false
      matrix:
        include:
        - framework: Laravel
          version: '12'
          php: '8.4'
          package: laravel/framework:^12.69.0
          exercised_package: laravel/framework:12.69.0
          bootstrap: fresh_supported_install
          script: laravel.php
        - framework: Laravel
          version: '13'
          php: '8.4'
          package: laravel/framework:^13.30.0
          exercised_package: laravel/framework:13.30.0
          bootstrap: fresh_supported_install
          script: laravel.php
        - framework: Symfony
          version: '8'
          php: '8.4'
          package: symfony/framework-bundle:^8.0
          console_package: symfony/console:^8.0
          script: symfony.php
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Check out the fixed APT prerequisite
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: durable-workflow/.github
        ref: 18783be6bef737cc778e4c7282a8797e39daa61a
        path: .central-apt-source
        persist-credentials: false
    - name: Select Ubuntu's Python 3.12
      run: '/usr/bin/python3 -I -S -c ''import sys; assert sys.version_info[:2] ==
        (3, 12)''

        echo /usr/bin >> "$GITHUB_PATH"

        '
    - name: Select authenticated dependency trust
      uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5
      with:
        clients: pip,python,composer,curl,git
    - name: Disable APT download retries (CVE-2026-109518)
      run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries
        >/dev/null
    - name: Prepare the reviewed PHP container runtime
      run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-container.sh" "8.4"
    - name: Verify Composer trust before requests
