    - name: Install SDK into a clean framework consumer
      env:
        FRAMEWORK_BOOTSTRAP: ${{ matrix.bootstrap }}
        FRAMEWORK_PACKAGE: ${{ matrix.package }}
        FRAMEWORK_EXERCISED_PACKAGE: ${{ matrix.exercised_package }}
        FRAMEWORK_CONSOLE_PACKAGE: ${{ matrix.console_package }}
        COMPAT_SCRIPT: ${{ matrix.script }}
      run: "consumer=\"$(mktemp -d)\"\nprintf '%s\\n' \"$consumer\" > \"$RUNNER_TEMP/framework-consumer\"\
        \ncd \"$consumer\"\ncomposer init --name=durable-workflow/framework-compat\
        \ --no-interaction\ncomposer config repositories.sdk path \"$GITHUB_WORKSPACE\"\
        \nif [ \"$COMPAT_SCRIPT\" = laravel.php ]; then\n  bootstrap_arguments=()\n\
        \  if [ \"$FRAMEWORK_BOOTSTRAP\" = existing_supported_lock ]; then\n    #\
        \ Model the established application named by the adoption contract.\n    #\
        \ Composer may refuse a new installation of an end-of-life Laravel\n    #\
        \ line, but SDK installation still runs with normal policy against\n    #\
        \ the resulting existing lock file.\n    bootstrap_arguments+=(--no-blocking)\n\
        \  fi\n  # matrix.package is the published caret support range. Install\n\
        \  # exactly its minimum release, and prove the SDK does not move it.\n  exercised_version=\"\
        ${FRAMEWORK_EXERCISED_PACKAGE#laravel/framework:}\"\n  composer require \"\
        $FRAMEWORK_EXERCISED_PACKAGE\" \\\n    --no-interaction --prefer-dist --no-progress\
