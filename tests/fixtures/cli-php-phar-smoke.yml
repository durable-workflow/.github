# Proposed caller only. Source/recipe review and accepted central admission
# precede copying this job into the live workflow.
jobs:
  build-phar:
    name: Build PHAR (smoke test)
    needs: [action-policy]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Check out the accepted PHP container build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Build and prepare the pinned PHAR caller profile
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-phar-container.sh"
      - run: php scripts/generate-build-info.php
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: box compile --no-parallel
      - run: box info build/dw.phar
      - run: php build/dw.phar list
