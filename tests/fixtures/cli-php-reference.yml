# Proposed caller. Activate only after exact central source admission.
jobs:
  rust:
    name: Rust CLI (unit tests and 2.x parity)
    needs: [action-policy]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,cargo,curl,git
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install completion test shells
        # CVE-2026-109518 needs APT to retry a redirected download; hosted
        # runner images still ship affected apt (durable-workflow/.github#295).
        run: |
          echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bash zsh fish
      - run: cargo test --locked
        env:
          DW_REQUIRE_COMPLETION_SHELLS: '1'
      - run: cargo build --locked
      - name: Check out the accepted PHP container build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Build and prepare the pinned PHP source-reference profile
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-reference-container.sh"
      - name: Compare compatibility checks with the 2.x PHP classes
        run: |
          php parity/compat-vectors.php ../src ../tests/fixtures src/compat/fixtures target/php-vectors.json
          DW_COMPAT_PHP_VECTORS=target/php-vectors.json cargo test --locked -- --ignored
      - name: Fetch the pinned 2.x reference CLI
        run: parity/fetch-reference.sh
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          working-directory: ${{ github.workspace }}
      - name: Install PHP main for the source reference
        # Cases marked "reference": "php-main" compare against this
        # checkout's PHP CLI (cli#61 behaviour 2.3.5 lacks).
        working-directory: ${{ github.workspace }}
        run: composer install --no-dev --prefer-dist --no-interaction
      - name: Compare against the 2.x CLI
        env:
          DW_PARITY_PHP_MAIN: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s parity -p 'test_*.py'
          python3 parity/parity.py --verbose

