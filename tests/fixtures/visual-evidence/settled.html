  <style>
    body { margin: 0; font: 16px sans-serif; }
    .sdk-title { width: 1ch; white-space: nowrap; overflow: hidden; }
    .search, .menu { display: none; }
    .ready .sdk-title { width: auto; overflow: visible; white-space: normal; }
    .ready .search, .ready .menu { display: block; }
  </style>
</head>
<body>
  <header>
    <h1 class="sdk-title"><span>Durable Workflow PHP SDK</span></h1>
    <button class="menu">Menu</button>

  </header>
  <script>
    window.setTimeout(() => {
      document.body.classList.add('ready');
      document.title = 'Settled API reference';
    }, 600);
  </script>
</body>
</html>
