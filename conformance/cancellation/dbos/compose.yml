services:
  sdk:
    image: python@sha256:3dd7cc108ec1493442514f5c2a871af6af0ec31d768ff6e378a93340c3b3db5f
    user: "1000:1000"
    init: true
    working_dir: /experiment
    command: ["sleep", "3600"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./worker.py:/experiment/worker.py:ro
      - ./scenario.py:/experiment/scenario.py:ro
      - ./requirements.txt:/experiment/requirements.txt:ro
      - ./evidence:/evidence
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
