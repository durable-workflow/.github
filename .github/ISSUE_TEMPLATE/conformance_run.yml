name: Conformance run
description: Record one exact-tuple conformance experiment and its retained evidence.
title: "[Conformance] "
labels:
  - kind:conformance-run
  - authority:github
  - priority:untriaged
  - status:triage
body:
  - type: input
    id: experiment
    attributes:
      label: Experiment
      description: Use the experiment name from conformance/README.md.
      placeholder: replay
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - pass
        - product-fail
        - runner-blocked
        - out-of-scope
    validations:
      required: true
  - type: textarea
    id: tuple
    attributes:
      label: Exact artifact tuple
      description: List Workflow, Waterline, Server, CLI, PHP SDK, Python SDK, and Rust SDK versions or immutable identities.
      placeholder: |
        workflow:
        waterline:
        server:
        cli:
        sdk-php:
        sdk-python:
        sdk-rust:
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner revision
      description: Public repository and full commit SHA used to execute the catalog command.
      placeholder: durable-workflow/server@0123456789abcdef...
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Run window
      description: UTC start and finish timestamps.
      placeholder: 2026-08-31T12:00:00Z to 2026-08-31T12:18:00Z
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exact catalog command and non-secret configuration used for this run.
      render: shell
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: GitHub Actions run, release asset, or immutable GitHub artifact URL containing the structured result.
      placeholder: https://github.com/durable-workflow/...
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary and findings
      description: State which runners executed, the observed result, and links to any product issue and fix PR. Do not include secrets or customer data.
    validations:
      required: true
