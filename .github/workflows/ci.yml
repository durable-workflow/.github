name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Shared contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2

      - name: Test retained shared contracts
        run: >-
          python -m unittest
          tests.test_qualification_policy
          tests.test_regression_corpus
          tests.test_regression_evidence_schema
          tests.test_server_codec_counterfactual_schema
          tests.test_visual_evidence

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test browser evidence boundary
        run: npm run test:visual-capture
