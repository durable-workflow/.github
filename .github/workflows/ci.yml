name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-dependencies:
    name: Locked policy wheels (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Create a disposable policy-client venv
        run: |
          python -I -m venv "$RUNNER_TEMP/policy-venv"
          printf '%s\n' "$RUNNER_TEMP/policy-venv/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/bootstrap-patched-pip # local
      - name: Prove isolated installation and wheel integrity
        run: python -I tests/test_policy_dependency_install.py

  contracts:
    name: Shared contract tests
    permissions:
      contents: read
      pull-requests: read
    needs: [policy-dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both native policy-wheel controls
        env:
          POLICY_RESULT: ${{ needs.policy-dependencies.result }}
        run: test "$POLICY_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: ./.github/actions/bootstrap-patched-pip # local
        with:
          clients: pip,python,composer,curl,git,npm,cargo

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:2.10.3, phpunit:11.5.57
          coverage: none

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm

      - uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866 # 1.86.0
        with:
          toolchain: 1.86.0

      - uses: ./.github/actions/verify-composer-trust # local

      - name: Install Python test dependencies
        run: >-
          python -I -m pip install --only-binary :all: jsonschema==4.23.0 PyYAML==6.0.2

      - name: Test retained shared contracts
        run: >-
          python -m unittest
          tests.test_qualification_policy
          tests.test_protected_policy_inputs
          tests.test_protected_policy_check
          tests.test_regression_corpus
          tests.test_regression_evidence_schema
          tests.test_server_codec_counterfactual_schema
          tests.test_visual_evidence
          tests.test_temporal_runtime
          tests.test_ci_trust
          tests.test_pip_effective_trust
          tests.test_cli_effective_trust
          tests.test_composer_trust_contract

      - name: Exercise the read-only policy client on this public PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -I scripts/protected_policy_check.py \
            --pull-request "$POLICY_PULL_REQUEST" --base-sha "$POLICY_BASE_SHA" \
            > "$RUNNER_TEMP/protected-policy-read.json"
          cat "$RUNNER_TEMP/protected-policy-read.json"

      - name: Test actual Composer trust selection
        run: COMPOSER_BINARY="$(command -v composer)" phpunit --configuration phpunit-composer-trust.xml --do-not-cache-result

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Test browser evidence boundary
        run: npm run test:visual-capture
