name: Beta conformance

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Canonical immutable candidate JSON matching candidates/schema.json
        required: true
        type: string
      injected_failure_experiment:
        description: Exercise deterministic product-failure retention without retry
        required: true
        default: none
        type: choice
        options:
          - none
          - replay
          - polyglot
          - heartbeats
          - signals-queries

permissions:
  contents: read

concurrency:
  group: beta-conformance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bind immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      experiments: ${{ steps.plan.outputs.experiments }}
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch immutable candidate records
        run: git fetch --force --tags origin 'refs/tags/beta-candidate/*:refs/tags/beta-candidate/*'

      - name: Write requested candidate without shell interpolation
        env:
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-candidate.json").write_text(os.environ["CANDIDATE_MANIFEST"], encoding="utf-8")
          PYTHON

      - name: Bind candidate, sources, runner, and experiment set
        id: plan
        run: |
          python scripts/beta_conformance.py prepare requested-candidate.json execution-plan.json \
            --contract beta-conformance/contract.json \
            --runner-revision "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pass immutable execution plan to isolated jobs
        uses: actions/upload-artifact@v7
        with:
          name: beta-conformance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-plan.json
          if-no-files-found: error
          retention-days: 30

  conformance:
    name: ${{ matrix.experiment }} exact artifacts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ fromJSON(needs.prepare.outputs.experiments) }}
    steps:
      - name: Check out the public conformance wrapper
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore immutable execution plan
        uses: actions/download-artifact@v8
        with:
          name: beta-conformance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance-input

      - name: Extract orchestration and fixtures from exact server image
        run: |
          python scripts/beta_conformance.py extract \
            conformance-input/execution-plan.json \
            "$RUNNER_TEMP/published-server" \
            "$RUNNER_TEMP/extraction.json"

      - name: Run time-bounded isolated experiment
        id: execute
        continue-on-error: true
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          INJECTED_FAILURE_EXPERIMENT: ${{ inputs.injected_failure_experiment }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG" "$RUNNER_TEMP/result"
          injection=()
          if [ "$INJECTED_FAILURE_EXPERIMENT" = "$EXPERIMENT" ]; then
            injection+=(--inject-product-failure)
          fi
          python scripts/beta_conformance.py run \
            conformance-input/execution-plan.json \
            "$EXPERIMENT" \
            "$RUNNER_TEMP/published-server" \
            "$RUNNER_TEMP/result" \
            --contract beta-conformance/contract.json \
            "${injection[@]}"

      - name: Retain bounded experiment evidence for aggregation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta-conformance-${{ matrix.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/experiment-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean experiment Docker resources
        if: always()
        run: docker system prune --all --force --volumes

      - name: Keep product and runner failures red
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: test "$EXECUTION_OUTCOME" = success

  retain:
    name: Retain durable GitHub evidence
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-conformance
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the public conformance wrapper
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore immutable execution plan
        uses: actions/download-artifact@v8
        with:
          name: beta-conformance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate-input

      - name: Restore experiment evidence
        uses: actions/download-artifact@v8
        with:
          pattern: beta-conformance-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Aggregate exact-tuple evidence
        id: aggregate
        run: |
          python scripts/beta_conformance.py aggregate \
            aggregate-input/execution-plan.json \
            evidence \
            suite-result.json \
            release-assets \
            --contract beta-conformance/contract.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or verify durable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.aggregate.outputs.candidate }}
          EVIDENCE_TAG: ${{ steps.aggregate.outputs.evidence_tag }}
          OUTCOME: ${{ steps.aggregate.outputs.outcome }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT

          if ! gh release view "$EVIDENCE_TAG" >/dev/null 2>&1; then
            notes="$(mktemp)"
            {
              printf 'Beta conformance `%s` for immutable candidate `%s`.\n\n' "$OUTCOME" "$CANDIDATE"
              printf 'Every attached experiment result binds the seven-artifact tuple, source and distribution '
              printf 'identities, runner revision, owning contract, retry record, and bounded diagnostics.\n'
            } > "$notes"
            gh release create "$EVIDENCE_TAG" --target "$GITHUB_SHA" \
              --title "Beta conformance ${CANDIDATE} (${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})" \
              --notes-file "$notes" --latest=false
          fi

          for asset in release-assets/*.json; do
            name="$(basename "$asset")"
            if gh release download "$EVIDENCE_TAG" --pattern "$name" --dir "$download_dir" >/dev/null 2>&1; then
              cmp --silent "$asset" "$download_dir/$name" || {
                printf 'durable evidence asset %s differs from the existing release\n' "$name" >&2
                exit 1
              }
            else
              gh release upload "$EVIDENCE_TAG" "$asset"
            fi
          done

      - name: Retain Actions mirror
        uses: actions/upload-artifact@v7
        with:
          name: beta-conformance-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce suite outcome after durable retention
        env:
          SUITE_OUTCOME: ${{ steps.aggregate.outputs.outcome }}
        run: test "$SUITE_OUTCOME" = pass
