name: Rust documentation visual evidence

on:
  workflow_call:
    inputs:
      source_base_sha:
        description: Candidate comparison revision; an unavailable revision fails safe to the complete visual set.
        required: false
        type: string

permissions:
  contents: read

jobs:
  visual-evidence:
    name: Rust reference candidate captures
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: ${{ github.repository }}

      - name: Check out visual evidence controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: visual-controller
          persist-credentials: false
          ref: main
          repository: durable-workflow/.github

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Classify candidate changes
        id: classify
        env:
          SOURCE_BASE_SHA: ${{ inputs.source_base_sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          test "$SOURCE_REPOSITORY" = durable-workflow/sdk-rust
          classification_args=(
            --root "$GITHUB_WORKSPACE/candidate"
            --profile rust-sdk-reference
          )
          if [[ "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            git -C candidate cat-file -e "${SOURCE_BASE_SHA}^{commit}" 2>/dev/null; then
            classification_args+=(--base-ref "$SOURCE_BASE_SHA")
          else
            mapfile -d '' candidate_files < <(git -C candidate ls-files -z)
            for candidate_file in "${candidate_files[@]}"; do
              classification_args+=(--changed-file "$candidate_file")
            done
          fi
          python visual-controller/scripts/visual_evidence.py classify \
            "${classification_args[@]}" > visual-classification.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          classification = json.loads(Path("visual-classification.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"required={str(bool(classification['classification'])).lower()}", file=output)
          PY

      - name: Install Rust 1.86
        if: steps.classify.outputs.required == 'true'
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        if: steps.classify.outputs.required == 'true'
        with:
          node-version: "24"

      - name: Install pinned visual capture runtime
        if: steps.classify.outputs.required == 'true'
        run: npm ci --prefix visual-controller

      - name: Build candidate API reference
        if: steps.classify.outputs.required == 'true'
        working-directory: candidate
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header docs/analytics-head.html
        run: |
          cargo doc --all-features --no-deps
          printf '%s\n' 'rust.durable-workflow.com' > target/doc/CNAME
          touch target/doc/.nojekyll
          cp docs/index.html target/doc/index.html
          cp docs/layout.css target/doc/layout.css
          mkdir -p target/doc/analytics
          cp docs/analytics/analytics.js target/doc/analytics/
          python3 scripts/check-docs-analytics.py target/doc

      - name: Capture candidate state matrix
        if: steps.classify.outputs.required == 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TMPDIR: ${{ runner.temp }}/rust-docs-visual-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$TMPDIR" visual-review
          python3 -m http.server 4173 --bind 127.0.0.1 --directory candidate/target/doc \
            >"$RUNNER_TEMP/rust-docs-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:4173/",
                      timeout=1,
                  ) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("candidate documentation preview did not become ready")
          PY
          capture() {
            local state=$1 width=$2 height=$3
            shift 3
            local capture_args=()
            if [ "$width" = 640 ] && [ "$height" = 360 ]; then
              capture_args+=(--full-page)
            fi
            node visual-controller/scripts/pipeline_visual_capture.mjs \
              --url http://127.0.0.1:4173/ \
              --surface rust-sdk-reference --state "$state" \
              --width "$width" --height "$height" \
              --source-repository durable-workflow/sdk-rust \
              --source-revision "$SOURCE_REVISION" \
              --screenshot "visual-review/${state}-${width}x${height}.png" \
              --report "visual-review/${state}-${width}x${height}.json" \
              --manifest visual-review/manifest.json "${capture_args[@]}" "$@"
          }
          for viewport in 1440x900 800x900 390x844 640x360; do
            width=${viewport%x*}
            height=${viewport#*x}
            capture analytics-ui-removed "$width" "$height"
          done

      - name: Validate source-bound candidate evidence
        if: steps.classify.outputs.required == 'true'
        env:
          SOURCE_BASE_SHA: ${{ inputs.source_base_sha }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          validation_args=(
            --root "$GITHUB_WORKSPACE/candidate"
            --profile rust-sdk-reference
            --expected-revision "$SOURCE_REVISION"
            --manifest "$GITHUB_WORKSPACE/visual-review/manifest.json"
          )
          if [[ "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            git -C candidate cat-file -e "${SOURCE_BASE_SHA}^{commit}" 2>/dev/null; then
            validation_args+=(--base-ref "$SOURCE_BASE_SHA")
          else
            mapfile -d '' candidate_files < <(git -C candidate ls-files -z)
            for candidate_file in "${candidate_files[@]}"; do
              validation_args+=(--changed-file "$candidate_file")
            done
          fi
          python visual-controller/scripts/visual_evidence.py validate "${validation_args[@]}"

      - name: Retain candidate visual evidence
        if: always() && steps.classify.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: error
          name: rust-docs-visual-${{ github.sha }}
          path: visual-review
          retention-days: 30
