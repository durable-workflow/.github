name: Source Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Control-plane source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install quality tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Validate source and policy
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool qualification/policy.json >/dev/null
          python -m json.tool qualification/schema.json >/dev/null
          python -m jsonschema -i qualification/policy.json qualification/schema.json
          python -m json.tool release-recovery/authority.json >/dev/null
          python -m json.tool release-recovery/schema.json >/dev/null
          python -m jsonschema -i release-recovery/authority.json release-recovery/schema.json
          python -m json.tool product-train/current.json >/dev/null
          python -m json.tool product-train/schema.json >/dev/null
          python -m jsonschema -i product-train/current.json product-train/schema.json
          python -m json.tool release-plans/current.json >/dev/null
          python -m json.tool release-plans/current-source-preparation.json >/dev/null
          python -m json.tool release-plans/schema.json >/dev/null
          python -m json.tool release-plans/source-preparation-schema.json >/dev/null
          python -m jsonschema -i release-plans/current.json release-plans/schema.json
          python -m jsonschema \
            -i release-plans/current-source-preparation.json \
            release-plans/source-preparation-schema.json
          python scripts/release_plan.py validate-current \
            release-plans/current.json candidates/main.json \
            /tmp/current-release-plan.json /tmp/current-candidate.json
          python -m json.tool release-recovery/consumer-conformance/contract.json >/dev/null
          python -m json.tool release-recovery/consumer-conformance/contract-schema.json >/dev/null
          python -m json.tool release-recovery/consumer-conformance/adapter-schema.json >/dev/null
          python -m jsonschema \
            -i release-recovery/consumer-conformance/contract.json \
            release-recovery/consumer-conformance/contract-schema.json
          conformance_args=()
          if [ -n "$CONFORMANCE_BASE_REF" ]; then
            conformance_args+=(--previous-ref "$CONFORMANCE_BASE_REF")
          fi
          python scripts/release_recovery_consumer_conformance.py \
            --contract release-recovery/consumer-conformance/contract.json \
            "${conformance_args[@]}"
          python -m json.tool beta-authorization/request-schema.json >/dev/null
          python -m json.tool beta-authorization/record-schema.json >/dev/null
          python -m json.tool beta-authorization/evidence-schema.json >/dev/null
          python scripts/issue_authority.py validate \
            issue-authority/policy.json issue-authority/backlog.json
          python -m json.tool issue-authority/policy-schema.json >/dev/null
          python -m json.tool issue-authority/backlog-schema.json >/dev/null
          python scripts/beta_conformance.py validate \
            beta-conformance/contract.json \
            beta-conformance/contract-schema.json \
            beta-conformance/plan-schema.json \
            beta-conformance/result-schema.json \
            beta-conformance/suite-result-schema.json
          python scripts/qualification_policy.py validate
        env:
          CONFORMANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Verify live public recovery authority
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          python scripts/release_plan.py verify-recovery-authority \
            release-recovery/authority.json \
            /tmp/recovery-workflow-authority-verification.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit synchronized release-recovery consumers
        if: >-
          github.server_url == 'https://github.com' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        run: >-
          python scripts/release_recovery_target_qualification.py
          --contract release-recovery/consumer-conformance/contract.json
          --evidence release-recovery-target-qualification-evidence.json

      - name: Retain release-recovery target evidence
        if: >-
          github.server_url == 'https://github.com' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-recovery-target-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-recovery-target-qualification-evidence.json
          if-no-files-found: error
          retention-days: 90
