name: Source Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Control-plane source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install quality tooling
        run: python -m pip install ruff==0.12.3 yamllint==1.37.1

      - name: Validate source and policy
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool qualification/policy.json >/dev/null
          python -m json.tool qualification/schema.json >/dev/null
          python scripts/qualification_policy.py validate
