name: Source Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Control-plane source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install quality tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Validate source and policy
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool qualification/policy.json >/dev/null
          python -m json.tool qualification/schema.json >/dev/null
          python -m jsonschema -i qualification/policy.json qualification/schema.json
          python -m json.tool release-recovery/authority.json >/dev/null
          python -m json.tool release-recovery/schema.json >/dev/null
          python -m jsonschema -i release-recovery/authority.json release-recovery/schema.json
          python -m json.tool release-recovery/consumer-conformance/contract.json >/dev/null
          python -m json.tool release-recovery/consumer-conformance/contract-schema.json >/dev/null
          python -m json.tool release-recovery/consumer-conformance/adapter-schema.json >/dev/null
          python -m jsonschema \
            -i release-recovery/consumer-conformance/contract.json \
            release-recovery/consumer-conformance/contract-schema.json
          conformance_args=()
          if [ -n "$CONFORMANCE_BASE_REF" ]; then
            conformance_args+=(--previous-ref "$CONFORMANCE_BASE_REF")
          fi
          python scripts/release_recovery_consumer_conformance.py \
            --contract release-recovery/consumer-conformance/contract.json \
            "${conformance_args[@]}"
          python -m json.tool beta-authorization/request-schema.json >/dev/null
          python -m json.tool beta-authorization/record-schema.json >/dev/null
          python -m json.tool beta-authorization/evidence-schema.json >/dev/null
          python scripts/issue_authority.py validate \
            issue-authority/policy.json issue-authority/backlog.json
          python -m json.tool issue-authority/policy-schema.json >/dev/null
          python -m json.tool issue-authority/backlog-schema.json >/dev/null
          python scripts/beta_conformance.py validate \
            beta-conformance/contract.json \
            beta-conformance/contract-schema.json \
            beta-conformance/plan-schema.json \
            beta-conformance/result-schema.json \
            beta-conformance/suite-result-schema.json
          python scripts/qualification_policy.py validate
        env:
          CONFORMANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
