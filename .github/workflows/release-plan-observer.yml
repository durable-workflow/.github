name: Release plan observer

run-name: Observe ${{ inputs.plan_tag || 'current actionable release plan' }}

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      plan_tag:
        description: Immutable release-plan tag; empty selects the newest public plan
        required: false
        type: string
        default: ''
      recorder_recovery_probe:
        description: Fail the first recorder attempt before mutation to exercise recorder-only recovery
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-plan-registry
  cancel-in-progress: false

jobs:
  observe:
    name: Observe real public release surfaces without write authority
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      plan-tag: ${{ steps.plan.outputs.tag }}
      plan-sha256: ${{ steps.plan.outputs.plan_sha256 }}
      preparation-sha256: ${{ steps.plan.outputs.preparation_sha256 }}
      verification-outcome: ${{ steps.verification.outcome }}
      handoff-attempt: ${{ steps.handoff.outputs.producer_attempt }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
      plan-available: ${{ steps.plan.outputs.available }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Discover immutable plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_PLAN_TAG: ${{ inputs.plan_tag }}
        run: |
          arguments=(release-plan.json --preparation release-preparation.json \
            --github-output "$GITHUB_OUTPUT")
          if [ -n "$REQUESTED_PLAN_TAG" ]; then
            arguments+=(--tag "$REQUESTED_PLAN_TAG")
          else
            arguments+=(--allow-empty)
          fi
          python scripts/release_plan.py discover "${arguments[@]}"

      - name: Report truthful scheduled no-op
        if: steps.plan.outputs.available == 'false'
        run: echo "No current actionable release plan is available."

      - name: Verify all declared source and distribution identities
        id: verification
        if: steps.plan.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_plan.py observe release-plan.json release-preparation.json \
            candidate-verifier-input.json verification.json release-state.json

      - name: Bind observation evidence to this producing attempt
        id: handoff
        if: ${{ always() && steps.plan.outputs.available == 'true' }}
        continue-on-error: true
        run: |
          python scripts/handoff_recovery.py create release-plan-observation handoff.json \
            --directory . \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pass only observation evidence to the recorder
        if: ${{ always() && steps.plan.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-plan-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-plan.json
            release-preparation.json
            candidate-verifier-input.json
            release-state.json
            verification.json
            handoff.json
          if-no-files-found: warn
          retention-days: 30

      - name: Package the privileged recorder handoff as one immutable file
        env:
          PLAN_AVAILABLE: ${{ steps.plan.outputs.available }}
        run: |
          if [ "$PLAN_AVAILABLE" = true ]; then
            handoff_files=(
              release-plan.json
              release-preparation.json
              candidate-verifier-input.json
              release-state.json
              handoff.json
            )
            if [ -f verification.json ]; then
              handoff_files+=(verification.json)
            fi
            tar -cf observation-recorder-handoff.tar "${handoff_files[@]}"
          else
            tar -cf observation-recorder-handoff.tar --files-from /dev/null
          fi

      - name: Bind the privileged recorder handoff identity and digest
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: observation-recorder-handoff.tar

  record:
    name: Record observation from a fresh checkout
    needs: observe
    if: >-
      github.server_url == 'https://github.com' &&
      needs.observe.outputs.plan-available == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
    outputs:
      current-plan: ${{ steps.aggregate.outputs.current }}
      current-plan-sha256: ${{ steps.aggregate.outputs.current-plan-sha256 }}
      current-plan-tag: ${{ steps.aggregate.outputs.current-plan-tag }}
    steps:
      - name: Check out a fresh qualified control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore isolated observation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.observe.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-observation-handoff
          repository: ${{ github.repository }}
          run-id: ${{ needs.observe.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-observation-handoff
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.observe.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.observe.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.observe.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.observe.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Extract the validated observation handoff
        run: |
          mkdir isolated-observation
          tar -xf isolated-observation-handoff/observation-recorder-handoff.tar -C isolated-observation

      - name: Validate the selected attempt-bound handoff
        run: |
          python scripts/handoff_recovery.py validate release-plan-observation \
            isolated-observation/handoff.json \
            --directory isolated-observation \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "${{ needs.observe.outputs.handoff-attempt }}"

      - name: Re-read the originally selected public plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PLAN_TAG: ${{ needs.observe.outputs.plan-tag }}
        run: |
          mkdir trusted-public-plan
          python scripts/release_plan.py discover \
            trusted-public-plan/release-plan.json \
            --preparation trusted-public-plan/release-preparation.json \
            --tag "$EXPECTED_PLAN_TAG"

      - name: Validate and canonicalize the isolated observation handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PLAN_TAG: ${{ needs.observe.outputs.plan-tag }}
          EXPECTED_PLAN_SHA256: ${{ needs.observe.outputs.plan-sha256 }}
          EXPECTED_PREPARATION_SHA256: ${{ needs.observe.outputs.preparation-sha256 }}
          EXPECTED_VERIFICATION_OUTCOME: ${{ needs.observe.outputs.verification-outcome }}
        run: |
          python scripts/release_plan.py validate-observation-handoff \
            isolated-observation/release-plan.json \
            isolated-observation/release-preparation.json \
            isolated-observation/candidate-verifier-input.json \
            isolated-observation/verification.json \
            isolated-observation/release-state.json \
            validated-observation \
            --authoritative-plan trusted-public-plan/release-plan.json \
            --authoritative-preparation trusted-public-plan/release-preparation.json \
            --expected-plan-tag "$EXPECTED_PLAN_TAG" \
            --expected-plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --expected-preparation-sha256 "$EXPECTED_PREPARATION_SHA256" \
            --expected-verification-outcome "$EXPECTED_VERIFICATION_OUTCOME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exercise recorder-only recovery before any mutation
        if: ${{ inputs.recorder_recovery_probe && github.run_attempt == 1 }}
        run: |
          echo "Recorder recovery probe stopped the first writer attempt before mutation." >&2
          exit 1

      - name: Retain aggregate state on the plan release
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_TAG: ${{ needs.observe.outputs.plan-tag }}
        run: gh release upload "$PLAN_TAG" validated-observation/release-state.json --clobber

      - name: Stop with an actionable recovery classification
        if: needs.observe.outputs.verification-outcome != 'success'
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path

          state = json.loads(
              Path("validated-observation/release-state.json").read_text(encoding="utf-8")
          )
          print(f"::error::{state['reason']}")
          PYTHON
          exit 1

      - name: Record channel-bound completed candidate
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$git_authorization"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_authorization" \
            python scripts/release_plan.py complete \
              validated-observation/release-plan.json \
              validated-observation/verification.json \
              --authoritative-completion authoritative-release-candidate.json \
              --authoritative-verification authoritative-verification.json \
              --github-output "$GITHUB_OUTPUT"

      - name: Create or repair completed candidate mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.record.outputs.candidate }}
          CHANNEL: ${{ steps.record.outputs.channel }}
          CANDIDATE_TAG: ${{ steps.record.outputs.tag }}
          RECORD_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          mirror_dir="$(mktemp -d)"
          trap 'rm -rf "$mirror_dir"' EXIT
          if ! gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            gh release create "$CANDIDATE_TAG" --verify-tag --prerelease \
              --title "Completed ${CHANNEL} release candidate ${CANDIDATE}" \
              --notes "All declared public artifacts were verified. The authoritative Git record is ${RECORD_COMMIT}."
          fi
          repair_asset() {
            source_path="$1"
            asset_name="$2"
            rm -f "$mirror_dir/$asset_name"
            if gh release download "$CANDIDATE_TAG" --pattern "$asset_name" --dir "$mirror_dir" >/dev/null 2>&1; then
              cmp --silent "$source_path" "$mirror_dir/$asset_name" || {
                printf 'release asset %s differs from immutable Git authority\n' "$asset_name" >&2
                exit 1
              }
            else
              upload_dir="$(mktemp -d)"
              cp "$source_path" "$upload_dir/$asset_name"
              gh release upload "$CANDIDATE_TAG" "$upload_dir/$asset_name"
            fi
          }
          repair_asset authoritative-release-candidate.json release-candidate.json
          repair_asset authoritative-verification.json verification.json

      - name: Classify whether the completed plan is current
        id: aggregate
        env:
          OBSERVED_PLAN_SHA256: ${{ needs.observe.outputs.plan-sha256 }}
          OBSERVED_PLAN_TAG: ${{ needs.observe.outputs.plan-tag }}
        run: |
          set -euo pipefail
          if cmp --silent \
            validated-observation/release-plan.json \
            release-plans/current.json; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "current-plan-sha256=$OBSERVED_PLAN_SHA256" >> "$GITHUB_OUTPUT"
            echo "current-plan-tag=$OBSERVED_PLAN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Completed plan is not the declared current product train."
          fi

  publish-current:
    name: Reconcile aggregate publication after current-plan completion
    needs: record
    if: >-
      success() &&
      github.server_url == 'https://github.com' &&
      github.ref == 'refs/heads/main' &&
      needs.record.outputs.current-plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact protected coalescing controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            release-plans/current.json
            scripts/current_plan_publication.py

      - name: Publish the matching aggregate current authority
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PLAN_SHA256: ${{ needs.record.outputs.current-plan-sha256 }}
          CURRENT_PLAN_TAG: ${{ needs.record.outputs.current-plan-tag }}
          TARGET_REF: main
          TARGET_REPOSITORY: durable-workflow/.github
          TARGET_WORKFLOW: current-release-plan.yml
        run: |
          set -euo pipefail
          python scripts/current_plan_publication.py reconcile-dispatch \
            --plan release-plans/current.json \
            --repository "$TARGET_REPOSITORY" \
            --workflow "$TARGET_WORKFLOW" \
            --ref "$TARGET_REF" \
            --observer-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$GITHUB_SHA" \
            --plan-tag "$CURRENT_PLAN_TAG" \
            --plan-sha256 "$CURRENT_PLAN_SHA256" \
            --github-output "$GITHUB_OUTPUT"
