name: Recovery workflow authority reconciliation

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: recovery-workflow-authority-reconciliation
  cancel-in-progress: false

jobs:
  observe:
    name: Observe qualified protected recovery workflow identities
    if: ${{ github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.proposal.outputs.artifact-digest }}
      artifact-id: ${{ steps.proposal.outputs.artifact-id }}
      changed: ${{ steps.observe.outputs.changed }}
      components: ${{ steps.observe.outputs.components }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Build one exact qualified reconciliation proposal
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir authority-proposal
          python scripts/recovery_authority_reconciliation.py reconcile \
            --proposed-authority authority-proposal/authority.json \
            --proposed-source-identities authority-proposal/protected-source-identities.json \
            --observation authority-proposal/observation.json \
            --github-output "$GITHUB_OUTPUT"
          tar -cf recovery-authority-proposal.tar -C authority-proposal \
            authority.json protected-source-identities.json observation.json

      - name: Retain the exact reconciliation proposal
        id: proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: recovery-authority-proposal.tar

  reconcile:
    name: Coalesce drift into one reviewable authority reconciliation
    needs: observe
    if: >-
      ${{ github.server_url == 'https://github.com' &&
          github.ref == 'refs/heads/main' &&
          needs.observe.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: beta-product-work
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore the exact observed proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.observe.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-recovery-authority-proposal
          repository: ${{ github.repository }}
          run-id: ${{ needs.observe.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-recovery-authority-proposal
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.observe.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.observe.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.observe.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.observe.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Revalidate exact protected evidence before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir validated-recovery-authority-proposal
          tar -xf \
            isolated-recovery-authority-proposal/recovery-authority-proposal.tar \
            -C validated-recovery-authority-proposal
          python scripts/recovery_authority_reconciliation.py verify-proposal \
            --proposed-authority validated-recovery-authority-proposal/authority.json \
            --proposed-source-identities \
              validated-recovery-authority-proposal/protected-source-identities.json \
            --observation validated-recovery-authority-proposal/observation.json

      - name: Create or update the single reconciliation pull request
        env:
          GH_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
          RECONCILIATION_BRANCH: automation/recovery-workflow-authority
          RECONCILIATION_COMPONENTS: ${{ needs.observe.outputs.components }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            printf 'beta product work token is required for reviewed reconciliation\n' >&2
            exit 1
          fi
          git_authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$git_authorization"
          git_config=(
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $git_authorization"
          )
          remote_exists=false
          if git "${git_config[@]}" fetch origin \
            "refs/heads/$RECONCILIATION_BRANCH:refs/remotes/origin/$RECONCILIATION_BRANCH"; then
            remote_exists=true
          fi

          git switch -C "$RECONCILIATION_BRANCH"
          cp validated-recovery-authority-proposal/authority.json \
            release-recovery/authority.json
          cp validated-recovery-authority-proposal/protected-source-identities.json \
            release-recovery/protected-source-identities.json
          authority_paths=(
            release-recovery/authority.json
            release-recovery/protected-source-identities.json
          )
          push_required=true
          if [ "$remote_exists" = true ] && git diff --quiet \
            "refs/remotes/origin/$RECONCILIATION_BRANCH" -- "${authority_paths[@]}"; then
            push_required=false
          fi
          if [ "$push_required" = true ]; then
            git add "${authority_paths[@]}"
            git config user.name "durable-workflow automation"
            git config user.email "support@durable-workflow.com"
            git commit -m "Reconcile protected recovery workflow authority"
            git "${git_config[@]}" push --force-with-lease origin \
              "HEAD:refs/heads/$RECONCILIATION_BRANCH"
          else
            echo "The existing reconciliation branch already has the exact proposal."
          fi

          title="Reconcile protected recovery workflow authority"
          body="Protected workflow drift was observed for: ${RECONCILIATION_COMPONENTS}. "
          body+="This proposal binds each successor to exact protected-branch source bytes "
          body+="and successful qualification evidence."
          pull_number="$(gh pr list --state open --head "$RECONCILIATION_BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$pull_number" ]; then
            gh pr edit "$pull_number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$RECONCILIATION_BRANCH" \
              --title "$title" --body "$body"
          fi
