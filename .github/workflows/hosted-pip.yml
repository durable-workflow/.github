name: Hosted pip bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/bootstrap-patched-pip/**'
      - '.github/workflows/hosted-pip.yml'
  pull_request:
    paths:
      - '.github/actions/bootstrap-patched-pip/**'
      - '.github/workflows/hosted-pip.yml'

permissions:
  contents: read

concurrency:
  group: hosted-pip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap on hosted Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/bootstrap-patched-pip # local
        with:
          clients: pip,python
      - run: python -I -m pip --version
