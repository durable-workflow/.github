name: Release plan

run-name: Record ${{ fromJSON(inputs.release_plan).plan }}

on:
  workflow_dispatch:
    inputs:
      release_plan:
        description: Exact channel-aware release plan JSON matching release-plans/schema.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-plan-registry
  cancel-in-progress: false

jobs:
  validate-and-record:
    name: Validate and record immutable release plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install changed-file quality tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Qualify release-plan tooling
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool release-plans/schema.json >/dev/null
          python -m json.tool release-plans/preparation-schema.json >/dev/null
          python -m json.tool release-plans/source-preparation-schema.json >/dev/null
          python -m json.tool release-plans/current-source-preparation.json >/dev/null
          python -m json.tool release-plans/current.json >/dev/null
          python -m json.tool release-plans/candidate-schema.json >/dev/null
          python -m json.tool product-train/schema.json >/dev/null
          python -m json.tool product-train/current.json >/dev/null
          python -m jsonschema -i product-train/current.json product-train/schema.json
          python -m jsonschema -i release-plans/current.json release-plans/schema.json

      - name: Canonicalize requested plan
        env:
          DISPATCH_PLAN: ${{ inputs.release_plan }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-release-plan.json").write_text(os.environ["DISPATCH_PLAN"], encoding="utf-8")
          PYTHON
          python scripts/release_plan.py validate requested-release-plan.json release-plan.json

      - name: Reject mutation of an existing plan identity
        run: python scripts/release_plan.py check release-plan.json

      - name: Verify public branch, source, tag, and channel preconditions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_plan.py preflight release-plan.json release-plan-preflight.json \
            --preparation release-preparation.json --release-date "$(date -u +%F)"

      - name: Create or compare the immutable Git record
        id: record
        run: |
          python scripts/release_plan.py record release-plan.json \
            release-preparation.json \
            --authoritative-plan authoritative-release-plan.json \
            --authoritative-preparation authoritative-release-preparation.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or repair the durable GitHub Release mirror
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.record.outputs.plan }}
          PLAN_TAG: ${{ steps.record.outputs.tag }}
          RECORD_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          mirror_dir="$(mktemp -d)"
          trap 'rm -rf "$mirror_dir"' EXIT
          if ! gh release view "$PLAN_TAG" >/dev/null 2>&1; then
            notes="$(mktemp)"
            {
              printf 'Immutable pre-publication plan at Git record `%s`.\n\n' "$RECORD_COMMIT"
              printf 'Component repositories discover its exact prepared notes and recover independently.\n'
            } > "$notes"
            gh release create "$PLAN_TAG" --verify-tag --prerelease \
              --title "Release plan ${PLAN}" --notes-file "$notes"
          fi
          if gh release download "$PLAN_TAG" --pattern release-plan.json --dir "$mirror_dir" >/dev/null 2>&1; then
            cmp --silent authoritative-release-plan.json "$mirror_dir/release-plan.json" || {
              printf 'release-plan.json differs from immutable Git authority\n' >&2
              exit 1
            }
          else
            upload_dir="$(mktemp -d)"
            cp authoritative-release-plan.json "$upload_dir/release-plan.json"
            gh release upload "$PLAN_TAG" "$upload_dir/release-plan.json"
          fi
          rm -f "$mirror_dir/release-preparation.json"
          if gh release download "$PLAN_TAG" --pattern release-preparation.json \
              --dir "$mirror_dir" >/dev/null 2>&1; then
            cmp --silent authoritative-release-preparation.json \
              "$mirror_dir/release-preparation.json" || {
              printf 'release-preparation.json differs from immutable Git authority\n' >&2
              exit 1
            }
          else
            upload_dir="$(mktemp -d)"
            cp authoritative-release-preparation.json "$upload_dir/release-preparation.json"
            gh release upload "$PLAN_TAG" "$upload_dir/release-preparation.json"
          fi

      - name: Upload preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-plan-preflight
          path: |
            authoritative-release-plan.json
            release-plan-preflight.json
            release-preparation.json
          if-no-files-found: error

      - name: Package the privileged continuity handoff as one immutable file
        run: |
          tar -cf continuity-handoff.tar \
            authoritative-release-plan.json release-plan-preflight.json release-preparation.json

      - name: Bind the privileged continuity handoff identity and digest
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: continuity-handoff.tar

  dispatch-accepted-continuity:
    name: Continue an accepted exact plan
    needs: validate-and-record
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the recorded plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.validate-and-record.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-continuity-handoff
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-and-record.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-continuity-handoff
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.validate-and-record.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.validate-and-record.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.validate-and-record.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-and-record.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Extract the validated continuity handoff
        run: |
          mkdir recorded-plan
          tar -xf isolated-continuity-handoff/continuity-handoff.tar -C recorded-plan

      - name: Dispatch continuity for an exact public acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/beta_continuity.py dispatch-accepted \
            recorded-plan/authoritative-release-plan.json
