name: Published cancellation behavior

on:
  pull_request:
    paths:
      - conformance/cancellation/**
      - .github/workflows/cancellation-competitors.yml
  workflow_dispatch:
    inputs:
      run_fixtures:
        description: Run fixtures under a separately reviewed runtime admission
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cancellation-competitors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restate:
    name: Restate published behavior
    if: github.event_name == 'workflow_dispatch' && inputs.run_fixtures == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/restate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare private evidence directory
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$GITHUB_WORKSPACE/conformance/cancellation/restate"
          umask 077
          mkdir -- evidence
      - name: Run documented cancellation cases
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/source.txt
          docker compose -p cancellation-restate up -d --wait
          docker compose -p cancellation-restate exec --user "$(id -u):$(id -g)" -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --disable-pip-version-check --no-deps --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
            /tmp/venv/bin/python scenario.py duplicate
          ' | tee evidence/run.log
      - name: Collect observations and remove the fixture
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -uo pipefail
          set -C
          log_status=0
          down_status=0
          absence_status=0
          docker compose -p cancellation-restate logs runtime > evidence/runtime.log || log_status=$?
          docker compose -p cancellation-restate down -v --remove-orphans || down_status=$?
          containers=$(docker ps -aq --filter label=com.docker.compose.project=cancellation-restate) || absence_status=1
          networks=$(docker network ls -q --filter label=com.docker.compose.project=cancellation-restate) || absence_status=1
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=cancellation-restate) || absence_status=1
          test -z "$containers$networks$volumes" || absence_status=1
          printf 'log_status=%s down_status=%s absence_status=%s\n' "$log_status" "$down_status" "$absence_status"
          test "$log_status:$down_status:$absence_status" = '0:0:0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: restate-cancellation-behavior
          path: conformance/cancellation/restate/evidence
          if-no-files-found: error
          retention-days: 90
  temporal:
    name: Temporal published behavior
    if: github.event_name == 'workflow_dispatch' && inputs.run_fixtures == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/temporal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare private evidence directory
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$GITHUB_WORKSPACE/conformance/cancellation/temporal"
          umask 077
          mkdir -- evidence
      - name: Run documented cancellation cases
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/source.txt
          sha256sum -- *.py requirements.txt versions.json compose.yml > evidence/source-files.txt
          docker compose -p cancellation-temporal up -d
          docker compose -p cancellation-temporal exec --user "$(id -u):$(id -g)" -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --disable-pip-version-check --no-deps --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
          ' | tee evidence/run.log
      - name: Collect observations and remove the fixture
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -uo pipefail
          set -C
          log_status=0
          down_status=0
          absence_status=0
          docker compose -p cancellation-temporal logs runtime > evidence/runtime.log || log_status=$?
          docker compose -p cancellation-temporal down -v --remove-orphans || down_status=$?
          containers=$(docker ps -aq --filter label=com.docker.compose.project=cancellation-temporal) || absence_status=1
          networks=$(docker network ls -q --filter label=com.docker.compose.project=cancellation-temporal) || absence_status=1
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=cancellation-temporal) || absence_status=1
          test -z "$containers$networks$volumes" || absence_status=1
          printf 'log_status=%s down_status=%s absence_status=%s\n' "$log_status" "$down_status" "$absence_status"
          test "$log_status:$down_status:$absence_status" = '0:0:0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: temporal-cancellation-behavior
          path: conformance/cancellation/temporal/evidence
          if-no-files-found: error
          retention-days: 90
  dbos:
    name: DBOS published behavior
    if: github.event_name == 'workflow_dispatch' && inputs.run_fixtures == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/dbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare private evidence directory
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$GITHUB_WORKSPACE/conformance/cancellation/dbos"
          umask 077
          mkdir -- evidence
      - name: Run supported cancellation and compensation cases
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/source.txt
          sha256sum -- *.py requirements.txt compose.yml > evidence/source-files.txt
          docker compose -p cancellation-dbos up -d
          docker compose -p cancellation-dbos exec --user "$(id -u):$(id -g)" -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --disable-pip-version-check --no-deps --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
          ' | tee evidence/run.log
      - name: Remove the fixture
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -uo pipefail
          down_status=0
          absence_status=0
          docker compose -p cancellation-dbos down -v --remove-orphans || down_status=$?
          containers=$(docker ps -aq --filter label=com.docker.compose.project=cancellation-dbos) || absence_status=1
          networks=$(docker network ls -q --filter label=com.docker.compose.project=cancellation-dbos) || absence_status=1
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=cancellation-dbos) || absence_status=1
          test -z "$containers$networks$volumes" || absence_status=1
          printf 'down_status=%s absence_status=%s\n' "$down_status" "$absence_status"
          test "$down_status:$absence_status" = '0:0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: dbos-cancellation-behavior
          path: conformance/cancellation/dbos/evidence
          if-no-files-found: error
          retention-days: 90
