name: Published cancellation behavior

on:
  pull_request:
    paths:
      - conformance/cancellation/**
      - .github/workflows/cancellation-competitors.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cancellation-competitors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restate:
    name: Restate published behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/restate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run documented cancellation cases
        run: |
          set -euo pipefail
          mkdir -p evidence
          chmod 0777 evidence
          git rev-parse HEAD > evidence/source.txt
          docker compose -p cancellation-restate up -d --wait
          docker compose -p cancellation-restate exec -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
            /tmp/venv/bin/python scenario.py duplicate
          ' | tee evidence/run.log
      - name: Collect observations and remove the fixture
        if: always()
        run: |
          mkdir -p evidence
          docker compose -p cancellation-restate logs runtime > evidence/runtime.log
          docker compose -p cancellation-restate down -v --remove-orphans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: restate-cancellation-behavior
          path: conformance/cancellation/restate/evidence
          if-no-files-found: error
          retention-days: 90
  temporal:
    name: Temporal published behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/temporal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run documented cancellation cases
        run: |
          set -euo pipefail
          mkdir -p evidence
          chmod 0777 evidence
          git rev-parse HEAD > evidence/source.txt
          sha256sum *.py requirements.txt versions.json compose.yml > evidence/source-files.txt
          docker compose -p cancellation-temporal up -d
          docker compose -p cancellation-temporal exec -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
          ' | tee evidence/run.log
      - name: Collect observations and remove the fixture
        if: always()
        run: |
          mkdir -p evidence
          docker compose -p cancellation-temporal logs runtime > evidence/runtime.log
          docker compose -p cancellation-temporal down -v --remove-orphans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: temporal-cancellation-behavior
          path: conformance/cancellation/temporal/evidence
          if-no-files-found: error
          retention-days: 90
  dbos:
    name: DBOS published behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conformance/cancellation/dbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run supported cancellation and compensation cases
        run: |
          set -euo pipefail
          mkdir -p evidence
          chmod 0777 evidence
          git rev-parse HEAD > evidence/source.txt
          sha256sum *.py requirements.txt compose.yml > evidence/source-files.txt
          docker compose -p cancellation-dbos up -d
          docker compose -p cancellation-dbos exec -T sdk sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --no-cache-dir --report /evidence/packages.json -r requirements.txt
            /tmp/venv/bin/python scenario.py
          ' | tee evidence/run.log
      - name: Remove the fixture
        if: always()
        run: docker compose -p cancellation-dbos down -v --remove-orphans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dbos-cancellation-behavior
          path: conformance/cancellation/dbos/evidence
          if-no-files-found: error
          retention-days: 90
