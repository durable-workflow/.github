name: Beta continuity

run-name: Continue ${{ inputs.plan_tag || 'scheduled workspace-unavailable beta drill' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta-continuity.yml
      - .github/workflows/beta-conformance.yml
      - .github/workflows/beta-conformance-retention.yml
      - beta-continuity/**
      - qualification/**
      - release-plans/continuity-resolution-schema.json
      - release-plans/continuity-successor-selection.json
      - scripts/beta_continuity.py
      - scripts/component_release_recovery.py
      - scripts/qualification_policy.py
      - scripts/release_plan.py
      - tests/test_beta_continuity.py
      - tests/test_component_release_recovery.py
      - tests/test_qualification_policy.py
      - tests/test_release_plan.py
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      plan_tag:
        description: Exact immutable release plan accepted by this continuity drill
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: read

concurrency:
  group: workspace-unavailable-beta-continuity
  cancel-in-progress: false

jobs:
  advance:
    name: Advance only from durable GitHub authority
    if: >-
      github.ref == 'refs/heads/main' &&
      github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beta-product-work
    permissions:
      actions: write
      checks: read
      contents: write
      issues: read
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install contract validators
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Qualify continuity controller source
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest -v \
            tests.test_beta_continuity \
            tests.test_component_release_recovery \
            tests.test_qualification_policy \
            tests.test_release_plan
          python -m jsonschema -i beta-continuity/config.json beta-continuity/schema.json
          python -m json.tool release-plans/continuity-successor-selection.json >/dev/null

      - name: Select or recover the exact drill plan
        id: plan
        continue-on-error: true
        env:
          CALLBACK_PLAN_TAG: ${{ inputs.plan_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          callback_plan=()
          if [ -n "$CALLBACK_PLAN_TAG" ]; then
            callback_plan+=(--expected-plan-tag "$CALLBACK_PLAN_TAG")
          fi
          python scripts/beta_continuity.py plan \
            beta-continuity/config.json \
            release-plan.json \
            expected-qualification-commits.json \
            continuity-state.json \
            "${callback_plan[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Route discovered release dependencies to their owning repositories
        if: ${{ steps.plan.outcome == 'failure' }}
        env:
          BETA_PRODUCT_WORK_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path

          state = json.loads(Path("continuity-state.json").read_text(encoding="utf-8"))
          if state.get("outcome") != "blocked":
              raise SystemExit("continuity planning failed without focused blocker evidence")
          PYTHON
          python scripts/beta_continuity.py route-blockers \
            beta-continuity/config.json continuity-state.json

      - name: Qualify the exact seven target commits before acceptance
        if: ${{ steps.plan.outputs.needs_qualification == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/qualification_policy.py audit \
            --expected-commits expected-qualification-commits.json \
            --evidence target-qualification-evidence.json

      - name: Advance one durable continuity phase
        id: advance
        if: ${{ steps.plan.outcome == 'success' }}
        env:
          BETA_PRODUCT_WORK_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          qualification=()
          if [ -f target-qualification-evidence.json ]; then
            qualification+=(--qualification target-qualification-evidence.json)
          fi
          python scripts/beta_continuity.py advance \
            beta-continuity/config.json release-plan.json continuity-state.json \
            "${qualification[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Retain the current GitHub observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: beta-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuity-state.json
            expected-qualification-commits.json
            release-plan.json
            target-qualification-evidence.json
          if-no-files-found: warn
          retention-days: 90
