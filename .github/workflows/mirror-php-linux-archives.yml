name: Mirror verified Linux PHP archives

# Manual only (issue 358). Copies each cataloged php-ubuntu archive that has no
# mirror ID into the php-linux-archives release, then reads it back by ID. A
# separate reviewed PR records the printed IDs in the catalog.
on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Full reviewed main commit selected for this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: php-archive-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror cataloged PHP archives by digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: php-archive-mirror
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the existing authenticated clean-store predecessor
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          clients: python
      - name: Upload sealed upstream bytes and read each asset back by ID
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          MIRROR_TOKEN: ${{ github.token }}
        run: python3 -I scripts/php_linux_mirror.py
