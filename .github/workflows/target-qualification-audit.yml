name: Target Qualification Audit

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: target-qualification-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit exact target commits and branch rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install qualification dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Audit GitHub qualification authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/qualification_policy.py audit
          --evidence target-qualification-evidence.json

      - name: Retain exact-commit audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: target-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-qualification-evidence.json
          if-no-files-found: error
