name: Release plan supersession

run-name: Supersede ${{ inputs.failed_plan_tag }} after ${{ inputs.conflicting_components }} conflicts

on:
  workflow_dispatch:
    inputs:
      failed_plan_tag:
        description: Immutable release-plan tag made unrecoverable by terminal allocation conflicts
        required: true
        type: string
      conflicting_components:
        description: Comma-separated terminal-conflict components in release-plan order
        required: true
        type: string
      successor_release_plan:
        description: Exact successor release plan resolving every conflicting allocation and no others
        required: true
        type: string

permissions: {}

concurrency:
  group: release-plan-registry
  cancel-in-progress: false

jobs:
  qualify:
    name: Prove protected terminal failure without write authority
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-plan-supersession
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install changed-file quality tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Qualify release-plan tooling
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool release-plans/failure-schema.json >/dev/null

      - name: Canonicalize exact successor plan
        env:
          SUCCESSOR_PLAN: ${{ inputs.successor_release_plan }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-successor.json").write_text(os.environ["SUCCESSOR_PLAN"], encoding="utf-8")
          PYTHON
          python scripts/release_plan.py validate requested-successor.json successor-release-plan.json

      - name: Prove terminal conflicts and protected authorization
        env:
          CONFLICTING_COMPONENTS: ${{ inputs.conflicting_components }}
          FAILED_PLAN_TAG: ${{ inputs.failed_plan_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_plan.py prepare-supersession \
            "$FAILED_PLAN_TAG" "$CONFLICTING_COMPONENTS" successor-release-plan.json \
            release-plan-failure.json authoritative-successor-release-plan.json \
            --actor "$GITHUB_ACTOR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-commit "$GITHUB_SHA"

      - name: Pass only protected supersession evidence to the recorder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-plan-supersession-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-plan-failure.json
            authoritative-successor-release-plan.json
          if-no-files-found: error

      - name: Package the privileged supersession handoff as one immutable file
        run: |
          tar -cf supersession-handoff.tar \
            release-plan-failure.json authoritative-successor-release-plan.json

      - name: Bind the privileged supersession handoff identity and digest
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: supersession-handoff.tar

  record:
    name: Record protected terminal failure from a fresh checkout
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out a fresh qualified control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore isolated supersession evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-supersession-handoff
          repository: ${{ github.repository }}
          run-id: ${{ needs.qualify.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-supersession-handoff
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.qualify.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.qualify.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.qualify.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.qualify.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Extract the validated supersession handoff
        run: |
          mkdir isolated-supersession
          tar -xf isolated-supersession-handoff/supersession-handoff.tar -C isolated-supersession

      - name: Rebuild and validate the authorized successor handoff
        env:
          CONFLICTING_COMPONENTS: ${{ inputs.conflicting_components }}
          FAILED_PLAN_TAG: ${{ inputs.failed_plan_tag }}
          SUCCESSOR_PLAN: ${{ inputs.successor_release_plan }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-successor.json").write_text(os.environ["SUCCESSOR_PLAN"], encoding="utf-8")
          PYTHON
          python scripts/release_plan.py validate requested-successor.json successor-release-plan.json
          cmp --silent \
            successor-release-plan.json \
            isolated-supersession/authoritative-successor-release-plan.json
          python scripts/release_plan.py validate-supersession-handoff \
            isolated-supersession/release-plan-failure.json \
            successor-release-plan.json authorized-release-plan-failure.json \
            --expected-failed-plan-tag "$FAILED_PLAN_TAG" \
            --expected-conflict-components "$CONFLICTING_COMPONENTS"

      - name: Create or compare immutable terminal record
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$git_authorization"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_authorization" \
            python scripts/release_plan.py record-supersession \
              authorized-release-plan-failure.json successor-release-plan.json \
              --authoritative-record authoritative-release-plan-failure.json \
              --authoritative-successor durable-successor-release-plan.json \
              --github-output "$GITHUB_OUTPUT"

      - name: Create or repair durable GitHub Release mirror
        env:
          FAILURE_TAG: ${{ steps.record.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          RECORD_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          mirror_dir="$(mktemp -d)"
          trap 'rm -rf "$mirror_dir"' EXIT
          if ! gh release view "$FAILURE_TAG" >/dev/null 2>&1; then
            gh release create "$FAILURE_TAG" --verify-tag --prerelease \
              --title "Terminal release plan failure" \
              --notes "Protected terminal record at immutable Git commit ${RECORD_COMMIT}."
          fi
          repair_asset() {
            source_path="$1"
            asset_name="$2"
            rm -f "$mirror_dir/$asset_name"
            if gh release download "$FAILURE_TAG" --pattern "$asset_name" --dir "$mirror_dir" >/dev/null 2>&1; then
              cmp --silent "$source_path" "$mirror_dir/$asset_name" || {
                printf 'release asset %s differs from immutable Git authority\n' "$asset_name" >&2
                exit 1
              }
            else
              upload_dir="$(mktemp -d)"
              cp "$source_path" "$upload_dir/$asset_name"
              gh release upload "$FAILURE_TAG" "$upload_dir/$asset_name"
            fi
          }
          repair_asset authoritative-release-plan-failure.json release-plan-failure.json
          repair_asset durable-successor-release-plan.json successor-release-plan.json

      - name: Upload recorded supersession evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-plan-supersession-${{ steps.record.outputs.failed_plan }}
          path: |
            authoritative-release-plan-failure.json
            durable-successor-release-plan.json
          if-no-files-found: error
