name: Beta conformance retention

run-name: >-
  Retain conformance
  ${{ inputs.source_run_id || github.event.workflow_run.id }}.${{
  inputs.source_run_attempt || github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Beta conformance]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Beta conformance run to retain without re-executing it
        required: true
        type: string
      source_run_attempt:
        description: Exact completed attempt to retain
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    beta-conformance-retention-${{
    inputs.source_run_id || github.event.workflow_run.id }}-${{
    inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  bind:
    name: Bind completed conformance run
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_candidate: ${{ steps.source.outputs.source_candidate }}
      source_completed_at: ${{ steps.source.outputs.source_completed_at }}
      source_head_sha: ${{ steps.source.outputs.source_head_sha }}
      source_run_attempt: ${{ steps.source.outputs.source_run_attempt }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
    steps:
      - name: Check out the trusted retention controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Resolve and validate the completed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ATTEMPT: >-
            ${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          python scripts/beta_conformance.py retention-source \
            --expected-run-id "$REQUESTED_RUN_ID" \
            --expected-run-attempt "$REQUESTED_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  retain:
    name: Publish durable conformance evidence
    needs: bind
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-conformance
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the trusted retention controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Restore immutable execution plan from the completed run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: beta-conformance-plan-${{ needs.bind.outputs.source_run_id }}
          path: aggregate-input
          github-token: ${{ github.token }}
          run-id: ${{ needs.bind.outputs.source_run_id }}

      - name: Restore experiment evidence from the completed run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: >-
            beta-conformance-*-${{ needs.bind.outputs.source_run_id }}-${{
            needs.bind.outputs.source_run_attempt }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.bind.outputs.source_run_id }}

      - name: Aggregate exact-tuple evidence
        id: aggregate
        run: |
          python scripts/beta_conformance.py aggregate \
            aggregate-input/execution-plan.json \
            evidence \
            suite-result.json \
            release-assets \
            --contract beta-conformance/contract.json \
            --run-id "${{ needs.bind.outputs.source_run_id }}" \
            --run-attempt "${{ needs.bind.outputs.source_run_attempt }}" \
            --generated-at "${{ needs.bind.outputs.source_completed_at }}" \
            --source-candidate "${{ needs.bind.outputs.source_candidate }}" \
            --source-head-sha "${{ needs.bind.outputs.source_head_sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or verify durable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.aggregate.outputs.candidate }}
          EVIDENCE_TAG: ${{ steps.aggregate.outputs.evidence_tag }}
          OUTCOME: ${{ steps.aggregate.outputs.outcome }}
          SOURCE_HEAD_SHA: ${{ needs.bind.outputs.source_head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ needs.bind.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ needs.bind.outputs.source_run_id }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT

          tag_endpoint="/repos/$GITHUB_REPOSITORY/git/ref/tags/$EVIDENCE_TAG"
          validate_evidence_ref() {
            ref_sha="$(python - <<'PYTHON'
          import json
          import re
          from pathlib import Path

          ref = json.loads(Path("evidence-ref.json").read_bytes())
          sha = ref.get("object", {}).get("sha") if isinstance(ref, dict) else None
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("conformance evidence ref does not name a commit")
          print(sha)
          PYTHON
            )"
            gh api "/repos/$GITHUB_REPOSITORY/compare/${ref_sha}...${GITHUB_SHA}" \
              > evidence-ref-comparison.json
            python scripts/beta_conformance.py retention-ref \
              evidence-ref.json evidence-ref-comparison.json \
              --expected-tag "$EVIDENCE_TAG" --source-sha "$SOURCE_HEAD_SHA" \
              --controller-sha "$GITHUB_SHA"
          }

          if ! gh release view "$EVIDENCE_TAG" >/dev/null 2>&1; then
            notes="$(mktemp)"
            create_log="$(mktemp)"
            {
              printf 'Beta conformance `%s` for immutable candidate `%s`.\n\n' "$OUTCOME" "$CANDIDATE"
              printf 'Every attached experiment result binds the seven-artifact tuple, source and distribution '
              printf 'identities, runner revision, owning contract, retry record, and bounded diagnostics.\n'
            } > "$notes"
            for attempt in 1 2 3; do
              create_target=(--target "$GITHUB_SHA")
              if gh api "$tag_endpoint" > evidence-ref.json 2>/dev/null; then
                validate_evidence_ref
                create_target=(--verify-tag)
              fi
              if gh release create "$EVIDENCE_TAG" "${create_target[@]}" \
                --title "Beta conformance ${CANDIDATE} (${SOURCE_RUN_ID}.${SOURCE_RUN_ATTEMPT})" \
                --notes-file "$notes" --latest=false >"$create_log" 2>&1; then
                break
              fi
              if gh release view "$EVIDENCE_TAG" >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                cat "$create_log" >&2
                exit 1
              fi
              printf 'release creation was denied; retrying attempt %s/3\n' "$((attempt + 1))" >&2
              sleep "$((attempt * 5))"
            done
          fi

          gh api "$tag_endpoint" > evidence-ref.json
          validate_evidence_ref

          for asset in release-assets/*.json; do
            name="$(basename "$asset")"
            if gh release download "$EVIDENCE_TAG" --pattern "$name" --dir "$download_dir" >/dev/null 2>&1; then
              cmp --silent "$asset" "$download_dir/$name" || {
                printf 'durable evidence asset %s differs from the existing release\n' "$name" >&2
                exit 1
              }
            else
              gh release upload "$EVIDENCE_TAG" "$asset"
            fi
          done

      - name: Retain Actions mirror
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: >-
            beta-conformance-suite-${{ needs.bind.outputs.source_run_id }}-${{
            needs.bind.outputs.source_run_attempt }}
          path: release-assets/*.json
          if-no-files-found: error
          retention-days: 90
