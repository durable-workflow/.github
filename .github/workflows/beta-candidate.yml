name: Beta candidate

run-name: >-
  Candidate ${{ inputs.candidate_manifest && fromJSON(inputs.candidate_manifest).candidate || 'main' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Exact beta candidate JSON matching candidates/schema.json
        required: true
        type: string
      recorder_recovery_probe:
        description: Fail the first recorder attempt before mutation to exercise recorder-only recovery
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: beta-candidate-registry
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify immutable candidate without write authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      handoff-attempt: ${{ steps.handoff.outputs.producer_attempt }}
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
    steps:
      - name: Check out the public control plane
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install changed-file quality tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 ruff==0.12.3 yamllint==1.37.1

      - name: Qualify the control-plane source
        run: |
          python -m ruff check scripts tests
          python -m yamllint .github/workflows
          python -m compileall -q scripts tests
          python -m unittest discover -v
          python -m json.tool candidates/schema.json >/dev/null
          python -m json.tool candidates/verification-schema.json >/dev/null

      - name: Require qualified and protected public target commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_EVENT: ${{ github.event_name }}
        run: |
          args=(audit --evidence target-qualification-evidence.json)
          if [ "$QUALIFICATION_EVENT" = push ]; then
            args+=(--skip-check-runs-for github-control-plane)
          fi
          python scripts/qualification_policy.py "${args[@]}"

      - name: Retain beta qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: beta-target-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-qualification-evidence.json
          if-no-files-found: error

      - name: Select requested candidate
        env:
          DISPATCH_MANIFEST: ${{ inputs.candidate_manifest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-candidate.json").write_text(os.environ["DISPATCH_MANIFEST"], encoding="utf-8")
          PYTHON
          else
            cp candidates/main.json requested-candidate.json
          fi
          python scripts/beta_candidate.py validate requested-candidate.json candidate.json

      - name: Reject mutation of an existing candidate identity
        run: python scripts/beta_candidate.py check candidate.json

      - name: Verify public artifacts and immutable source releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/beta_candidate.py verify candidate.json verification.json

      - name: Bind candidate evidence to this producing attempt
        id: handoff
        run: |
          python scripts/handoff_recovery.py create candidate handoff.json \
            --directory . \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pass only candidate verification evidence to the recorder
        uses: actions/upload-artifact@v7
        with:
          name: beta-candidate-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate.json
            verification.json
            handoff.json
          if-no-files-found: error
          retention-days: 30

  record:
    name: Record qualified immutable candidate from a fresh checkout
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out a fresh qualified control plane
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Select the newest exact handoff from this workflow run
        id: handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/handoff_recovery.py select candidate \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "${{ needs.qualify.outputs.handoff-attempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore isolated candidate verification evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.handoff.outputs.artifact_id }}
          path: isolated-verification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate the selected attempt-bound handoff
        run: |
          python scripts/handoff_recovery.py validate candidate \
            isolated-verification/handoff.json \
            --directory isolated-verification \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "${{ steps.handoff.outputs.producer_attempt }}"

      - name: Rebuild and validate the authorized verification handoff
        env:
          DISPATCH_MANIFEST: ${{ inputs.candidate_manifest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python - <<'PYTHON'
          import os
          from pathlib import Path

          Path("requested-candidate.json").write_text(os.environ["DISPATCH_MANIFEST"], encoding="utf-8")
          PYTHON
          else
            cp candidates/main.json requested-candidate.json
          fi
          python scripts/beta_candidate.py validate requested-candidate.json candidate.json
          python scripts/beta_candidate.py compare candidate.json isolated-verification/candidate.json
          python scripts/beta_candidate.py validate-verification \
            candidate.json isolated-verification/verification.json

      - name: Exercise recorder-only recovery before any mutation
        if: ${{ inputs.recorder_recovery_probe && github.run_attempt == 1 }}
        run: |
          echo "Recorder recovery probe stopped the first writer attempt before mutation." >&2
          exit 1

      - name: Create or compare the immutable Git record
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$git_authorization"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_authorization" \
            python scripts/beta_candidate.py record \
              candidate.json isolated-verification/verification.json \
              --authoritative-verification authoritative-verification.json \
              --github-output "$GITHUB_OUTPUT"

      - name: Create or repair the durable GitHub Release mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.record.outputs.candidate }}
          CANDIDATE_TAG: ${{ steps.record.outputs.tag }}
          RECORD_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          mirror_dir="$(mktemp -d)"
          trap 'rm -rf "$mirror_dir"' EXIT

          if ! gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            notes="$(mktemp)"
            {
              printf 'Immutable beta candidate `%s`.\n\n' "$CANDIDATE"
              printf 'The authoritative Git record is commit `%s` at tag `%s`. ' "$RECORD_COMMIT" "$CANDIDATE_TAG"
              printf 'The attached JSON files mirror that record for durable API queries and recovery.\n'
            } > "$notes"
            gh release create "$CANDIDATE_TAG" --verify-tag \
              --title "Beta candidate ${CANDIDATE}" --notes-file "$notes"
          fi

          repair_asset() {
            source_path="$1"
            asset_name="$2"
            if gh release download "$CANDIDATE_TAG" --pattern "$asset_name" --dir "$mirror_dir" >/dev/null 2>&1; then
              cmp --silent "$source_path" "$mirror_dir/$asset_name" || {
                printf 'release asset %s differs from immutable Git authority\n' "$asset_name" >&2
                exit 1
              }
            else
              upload_dir="$(mktemp -d)"
              cp "$source_path" "$upload_dir/$asset_name"
              gh release upload "$CANDIDATE_TAG" "$upload_dir/$asset_name"
            fi
          }

          repair_asset candidate.json candidate.json
          repair_asset authoritative-verification.json verification.json
