name: GitHub Issue Authority

on:
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-authority.yml
      - issue-authority/**
      - qualification/policy.json
      - scripts/issue_authority.py
      - scripts/cross_repository_lifecycle.py
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  repository_dispatch:
    types: [public-lifecycle]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Activate prerelease supersessions, apply migration, or audit authority
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - activate

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.server_url == 'https://github.com' &&
        'github-issue-authority-public' ||
        format('github-issue-authority-local-{0}-{1}', github.repository, github.event.issue.number) }}
  cancel-in-progress: >-
    ${{ (github.server_url == 'https://github.com' && github.event_name == 'push') ||
        (github.server_url != 'https://github.com' && github.event_name == 'issues') }}

jobs:
  validate:
    name: Validate public intake and selective migration
    if: ${{ github.event_name != 'issues' || github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Validate machine-owned authority contracts
        run: |
          python scripts/issue_authority.py validate \
            issue-authority/policy.json issue-authority/backlog.json
          python -m json.tool issue-authority/policy.json >/dev/null
          python -m json.tool issue-authority/policy-schema.json >/dev/null
          python -m json.tool issue-authority/backlog.json >/dev/null
          python -m json.tool issue-authority/backlog-schema.json >/dev/null

  metadata-age-audit:
    name: Audit metadata-only public lifecycle age
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.server_url == 'https://github.com' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Audit admitted repository metadata without issue prose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/issue_authority.py metadata-audit \
            issue-authority/policy.json issue-authority/backlog.json \
            --evidence public-issue-age-audit.json

      - name: Retain the exact public age contract artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: public-issue-age-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-issue-age-audit.json
          if-no-files-found: error
          retention-days: 90

  release_completion:
    name: Reconcile verified releases before issue intake
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.server_url == 'https://github.com' &&
          github.event_name == 'repository_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-product-work
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Materialize the authenticated release projection
        env:
          PROJECTION_JSON: ${{ toJSON(github.event.client_payload.projection) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          projection = json.loads(os.environ["PROJECTION_JSON"])
          Path("public-lifecycle-projection.json").write_text(
              json.dumps(projection, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Close source-bound releases before intake can reserve them
        env:
          BETA_PRODUCT_WORK_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTION_ACTOR: ${{ github.actor }}
        run: |
          python scripts/issue_authority.py complete-before-intake \
            issue-authority/policy.json issue-authority/backlog.json \
            --lifecycle-projection public-lifecycle-projection.json \
            --projection-actor "$PROJECTION_ACTOR" \
            --evidence pre-intake-release-completion.json

      - name: Retain pre-intake completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pre-intake-release-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: pre-intake-release-completion.json
          if-no-files-found: error
          retention-days: 90

  intake:
    name: Reconstruct vetted issue revisions with read-only access
    if: >-
      ${{ always() &&
          needs.validate.result == 'success' &&
          (needs.release_completion.result == 'success' || needs.release_completion.result == 'skipped') &&
          github.server_url == 'https://github.com' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           github.event_name == 'issues' ||
           github.event_name == 'repository_dispatch' ||
           (github.event_name == 'workflow_dispatch' && inputs.mode != 'activate')) }}
    needs: [validate, release_completion]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      statuses: read
    outputs:
      intake_ready: ${{ steps.discover.outputs.intake_ready }}
      manifest_artifact_digest: ${{ steps.intake_manifest.outputs.artifact-digest }}
      manifest_artifact_id: ${{ steps.intake_manifest.outputs.artifact-id }}
      source_run_attempt: ${{ github.run_attempt }}
      source_run_id: ${{ github.run_id }}
      trigger_approved: ${{ steps.discover.outputs.trigger_approved }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Bind trusted approval to current issue revisions
        id: discover
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.event.sender.login }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTION_ACTOR: ${{ github.actor }}
          PROJECTION_JSON: ${{ toJSON(github.event.client_payload.projection) }}
          TRIGGER_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          arguments=()
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          projection = json.loads(os.environ["PROJECTION_JSON"])
          Path("public-lifecycle-projection.json").write_text(
              json.dumps(projection, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
            arguments+=(
              --lifecycle-projection public-lifecycle-projection.json
              --projection-actor "$PROJECTION_ACTOR"
            )
          fi
          if [[ "$EVENT_NAME" == "issues" ]]; then
            arguments+=(
              --trigger-repository "$TRIGGER_REPOSITORY"
              --trigger-number "$TRIGGER_NUMBER"
              --trigger-action "$EVENT_ACTION"
              --trigger-actor "$EVENT_ACTOR"
              --trigger-label "$EVENT_LABEL"
            )
          fi
          python scripts/issue_authority.py discover \
            issue-authority/policy.json issue-authority/backlog.json \
            --output issue-intake.json \
            --github-output "$GITHUB_OUTPUT" \
            "${arguments[@]}"

      - name: Retain the exact vetted intake manifest
        id: intake_manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: issue-intake.json

  activate:
    name: Activate immutable prerelease supersession authority
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.server_url == 'https://github.com' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'activate' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-product-work
    permissions:
      contents: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Create only missing trusted supersession statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/issue_authority.py activate \
            issue-authority/policy.json issue-authority/backlog.json \
            --evidence issue-authority-activation-evidence.json

      - name: Retain prerelease activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: github-issue-authority-activate-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-authority-activation-evidence.json
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Apply reviewed beta backlog to GitHub
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.server_url == 'https://github.com' &&
          needs.intake.outputs.intake_ready == 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')) }}
    needs: [validate, intake]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-product-work
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the exact vetted intake manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.intake.outputs.manifest_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-issue-intake
          repository: ${{ github.repository }}
          run-id: ${{ needs.intake.outputs.source_run_id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-issue-intake
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.intake.outputs.manifest_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.intake.outputs.manifest_artifact_id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.intake.outputs.source_run_attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.intake.outputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Create reviewed issues and reconcile blocker context
        env:
          BETA_PRODUCT_WORK_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/issue_authority.py apply \
            issue-authority/policy.json issue-authority/backlog.json \
            --intake-manifest isolated-issue-intake/issue-intake.json \
            --evidence issue-authority-evidence.json

      - name: Preserve a failure record when authority evidence is unavailable
        if: failure()
        run: |
          if [ ! -f issue-authority-evidence.json ]; then
            printf '%s%s\n' \
              '{"error":"workflow failed before authority evidence was written",' \
              '"mode":"apply","outcome":"fail","schema":"durable-workflow.github-issue-authority-evidence/v1"}' \
              >issue-authority-evidence.json
          fi

      - name: Retain migration or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: github-issue-authority-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-authority-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  audit:
    name: Audit GitHub lifecycle authority
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.server_url == 'https://github.com' &&
          needs.intake.outputs.intake_ready == 'true' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'repository_dispatch' ||
           (github.event_name == 'issues' && needs.intake.outputs.trigger_approved == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')) }}
    needs: [validate, intake]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-product-work
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the exact vetted intake manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.intake.outputs.manifest_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-issue-intake
          repository: ${{ github.repository }}
          run-id: ${{ needs.intake.outputs.source_run_id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-issue-intake
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.intake.outputs.manifest_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.intake.outputs.manifest_artifact_id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.intake.outputs.source_run_attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.intake.outputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Reconcile lifecycle and audit public issue and pull-request age
        env:
          BETA_PRODUCT_WORK_TOKEN: ${{ secrets.BETA_PRODUCT_WORK_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTION_ACTOR: ${{ github.actor }}
          PROJECTION_JSON: ${{ toJSON(github.event.client_payload.projection) }}
        run: |
          arguments=()
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          projection = json.loads(os.environ["PROJECTION_JSON"])
          Path("public-lifecycle-projection.json").write_text(
              json.dumps(projection, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
            arguments+=(
              --lifecycle-projection public-lifecycle-projection.json
              --projection-actor "$PROJECTION_ACTOR"
            )
          fi
          python scripts/issue_authority.py audit \
            issue-authority/policy.json issue-authority/backlog.json \
            --intake-manifest isolated-issue-intake/issue-intake.json \
            --evidence issue-authority-evidence.json \
            "${arguments[@]}"

      - name: Preserve a failure record when authority evidence is unavailable
        if: failure()
        run: |
          if [ ! -f issue-authority-evidence.json ]; then
            printf '%s%s\n' \
              '{"error":"workflow failed before authority evidence was written",' \
              '"mode":"audit","outcome":"fail","schema":"durable-workflow.github-issue-authority-evidence/v1"}' \
              >issue-authority-evidence.json
          fi

      - name: Materialize the exact metadata age audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence_path = Path("issue-authority-evidence.json")
          if not evidence_path.exists():
              raise SystemExit(0)
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          age_audit = evidence.get("age_audit")
          if age_audit is not None:
              Path("public-issue-age-audit.json").write_text(
                  json.dumps(age_audit, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              pipeline_health = age_audit.get("pipeline_health")
              if pipeline_health is not None:
                  Path("public-issue-lifecycle-health.json").write_text(
                      json.dumps(pipeline_health, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
          issue_sweep = evidence.get("issue_sweep")
          if issue_sweep is not None:
              Path("public-issue-sweep.json").write_text(
                  json.dumps(issue_sweep, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Retain authority audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: github-issue-authority-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            issue-authority-evidence.json
            public-issue-age-audit.json
            public-issue-lifecycle-health.json
            public-issue-sweep.json
          if-no-files-found: ignore
          retention-days: 90
