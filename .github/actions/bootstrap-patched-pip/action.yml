name: Bootstrap patched pip trust
description: Authenticate patched pip and export its verified clean CA bundle for subsequent CI requests.
inputs:
  operation:
    description: Bootstrap the private runtime, or verify the existing explicit runtime without acquisition.
    default: bootstrap
  clients:
    description: Comma-separated Linux CI clients invoked by later steps (pip, python, composer, curl, git, npm, cargo).
    default: pip

outputs:
  pip-state:
    description: Exact owned private-runtime receipt for later origin verification and cleanup.
    value: ${{ steps.runtime.outputs.pip-state }}
  pip-python:
    description: Bound job-private Python executable preserving the selected interpreter version.
    value: ${{ steps.runtime.outputs.pip-python }}
  pip-created:
    description: Whether this invocation created the exact private runtime.
    value: ${{ steps.runtime.outputs.pip-created }}
  pip-root-identity:
    description: Producer-captured directory identity for exact owned-state cleanup.
    value: ${{ steps.runtime.outputs.pip-identity }}
  pip-receipt-identity:
    description: Producer-captured receipt object and SHA-256 before product execution.
    value: ${{ steps.runtime.outputs.pip-receipt-identity }}
  ca-file:
    description: Absolute path of the verified public CA bundle.
    value: ${{ steps.trust.outputs.ca-file }}
  ca-directory:
    description: Empty directory excluding additional OpenSSL/Git/Composer roots.
    value: ${{ steps.trust.outputs.ca-directory }}
  ca-sha256:
    description: SHA-256 of the verified CA bundle.
    value: ${{ steps.trust.outputs.ca-sha256 }}

runs:
  using: composite
  steps:
    - name: Protect the hosted toolcache parent
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: /usr/bin/sudo --non-interactive /usr/bin/python3 -I -S -B "$GITHUB_ACTION_PATH/protect-hosted-runtime.py" "$pythonLocation"
    - name: Seed or verify the exact job-private pip runtime
      id: runtime
      shell: bash
      env:
        TRUST_OPERATION: ${{ inputs.operation }}
        TRUST_CALLER_LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
        LD_LIBRARY_PATH: ''
        LD_PRELOAD: ''
        LD_AUDIT: ''
      run: |
        set -euo pipefail
        selected_python="$(command -v python)"
        exec /usr/bin/python3 -I -S -B "$GITHUB_ACTION_PATH/pip_runtime.py" "$TRUST_OPERATION" "$selected_python"
    - name: Verify and export the effective CI trust bundle
      id: trust
      shell: bash
      env:
        TRUST_CLIENTS: ${{ inputs.clients }}
        TRUST_RUNTIME: ${{ steps.runtime.outputs.pip-state }}
        TRUST_CREATED: ${{ steps.runtime.outputs.pip-created }}
        TRUST_ROOT_IDENTITY: ${{ steps.runtime.outputs.pip-identity }}
        TRUST_CALLER_LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
        LD_LIBRARY_PATH: ''
        LD_PRELOAD: ''
        LD_AUDIT: ''
      run: exec /usr/bin/python3 -I -S -B "$GITHUB_ACTION_PATH/export-trust.py" --runtime "$TRUST_RUNTIME"
