name: Bootstrap patched pip trust
description: Authenticate patched pip and export its verified clean CA bundle for subsequent CI requests.
inputs:
  clients:
    description: Comma-separated Linux CI clients invoked by later steps (pip, python, composer, curl, git, npm, cargo).
    default: pip

outputs:
  ca-file:
    description: Absolute path of the verified public CA bundle.
    value: ${{ steps.trust.outputs.ca-file }}
  ca-directory:
    description: Empty directory excluding additional OpenSSL/Git/Composer roots.
    value: ${{ steps.trust.outputs.ca-directory }}
  ca-sha256:
    description: SHA-256 of the verified CA bundle.
    value: ${{ steps.trust.outputs.ca-sha256 }}

runs:
  using: composite
  steps:
    - name: Install and verify pip 26.2.2
      shell: bash
      run: |
        set -euo pipefail
        python -I -m pip --isolated --disable-pip-version-check install --no-deps --upgrade \
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        test "$(python -I -c 'import pip; print(pip.__version__)')" = 26.2.2
    - name: Verify and export the effective CI trust bundle
      id: trust
      shell: bash
      env:
        TRUST_CLIENTS: ${{ inputs.clients }}
      run: python -I "$GITHUB_ACTION_PATH/export-trust.py"
